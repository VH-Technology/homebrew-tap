name: Audit casks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: macos-latest
    env:
      # `brew audit --online` queries the GitHub API (livecheck, release
      # lookups). Unauthenticated requests share the runner IP's 60/hour
      # budget and get rate-limited; the job token lifts that.
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - name: Tap this repository
        run: brew tap vh-technology/tap "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

      - name: Check out the ref under test into the tap
        uses: actions/checkout@v4
        with:
          path: tap-src

      - name: Sync tap with checked-out ref
        run: |
          set -euo pipefail
          tap_dir="$(brew --repository vh-technology/tap)"
          rsync -a --delete --exclude .git tap-src/ "$tap_dir/"

      - name: brew style
        run: brew style vh-technology/tap

      - name: brew audit
        run: |
          set -euo pipefail
          for cask in tap-src/Casks/*.rb; do
            token="$(basename "$cask" .rb)"
            brew audit --cask --online "vh-technology/tap/$token"
          done
